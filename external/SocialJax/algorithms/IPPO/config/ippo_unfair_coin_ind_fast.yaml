# =============================================================================
# IPPO Baseline on Unfair Coin Game - FAST TESTING CONFIG
# =============================================================================
# Lightweight config for quick testing of methods and fairness
# Reduced parameters for faster training:
# - Smaller grid size (8x6 instead of 16x11)
# - Lower minibatches, higher learning rate
# - Fewer timesteps and environments
# =============================================================================

# descriptive filename to save params as.
"SAVE_PARAMS_AS": "fast_unfar_ind"

# Learning rate (moderately increased for faster learning, but stable)
"LR": 0.0005             # 5x higher than paper (0.0001) - more stable than 0.001
"ANNEAL_LR": True

# PPO hyperparameters (reduced for faster training)
"NUM_ENVS": 128          # Reduced from 256 (2x fewer) - enough for stable gradients
"NUM_STEPS": 500         # Reduced from 1000 (2x fewer)
"TOTAL_TIMESTEPS": 5e7   # 50M timesteps - enough to see learning curves diverge
"UPDATE_EPOCHS": 2
"NUM_MINIBATCHES": 64    # Reduced from 500 - still reasonable batch size
"GAMMA": 0.99
"GAE_LAMBDA": 0.95
"CLIP_EPS": 0.2
"ENT_COEF": 0.1
"VF_COEF": 0.1
"MAX_GRAD_NORM": 0.5
"ACTIVATION": "relu"

# Environment - Unfair Coin Game (moderately smaller grid for faster training)
"ENV_NAME": "coin_game"
"ENV_KWARGS":
  "num_agents": 2
  "num_inner_steps": 500      # Reduced from 1000 (2x fewer)
  "shared_rewards": False     # Individual rewards only
  "green_coin_prob": 0.9375   # UNFAIR: 15/16 green, 1/16 red
  "grid_size": [12, 8]        # Moderately smaller: 12x8 (was 16x11) - preserves dynamics
  "obs_size": 9               # Slightly smaller observation window (was 11)
  "cnn": True
  "jit": True

# Reward shaping (reduced horizons)
"REW_SHAPING_HORIZON": 2.5e5   # Reduced from 2.5e6
"SHAPING_BEGIN": 1e5           # Reduced from 1e6

# Training
"SEED": 42
"NUM_SEEDS": 1
"REWARD": "individual"
"GIF_NUM_FRAMES": 250
"PARAMETER_SHARING": True
"TUNE": False

# FCGrad settings - DISABLED (this is the baseline)
"FCGRAD": False              # Baseline IPPO without FCGrad
"USE_DUAL_HEAD": False       # Single value head (standard IPPO)
"FCGRAD_BETA": 0.5           # Not used when FCGRAD=False

# WandB
"ENTITY": ""
"PROJECT": "ippo-unfair-coin-test"  # Note: Using shared team project (name is misleading but required for team access)
"WANDB_MODE": "online"
"WANDB_TAGS":
  - IPPO
  - BASELINE
  - UNFAIR_COIN
  - INDIVIDUAL_REWARD
  - FAST_TEST
