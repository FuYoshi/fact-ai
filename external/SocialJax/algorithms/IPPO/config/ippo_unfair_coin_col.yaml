# =============================================================================
# IPPO Baseline (COLLECTIVE) on Unfair Coin Game
# =============================================================================
# Col baseline: All agents share the collective reward
# shared_rewards: True means all agents get the same (averaged) reward
# =============================================================================

"LR": 0.0001
"ANNEAL_LR": True

"NUM_ENVS": 256
"NUM_STEPS": 1000
"TOTAL_TIMESTEPS": 1e9
"UPDATE_EPOCHS": 2
"NUM_MINIBATCHES": 500
"GAMMA": 0.99
"GAE_LAMBDA": 0.95
"CLIP_EPS": 0.2
"ENT_COEF": 0.1
"VF_COEF": 0.1
"MAX_GRAD_NORM": 0.5
"ACTIVATION": "relu"

"ENV_NAME": "coin_game"
"ENV_KWARGS": 
  "num_agents": 2
  "num_inner_steps": 1000
  "shared_rewards": True      # COLLECTIVE: All agents share reward
  "green_coin_prob": 0.9375
  "cnn": True
  "jit": True

"REW_SHAPING_HORIZON": 2.5e6
"SHAPING_BEGIN": 1e6

"SEED": 42
"NUM_SEEDS": 1
"REWARD": "collective"
"GIF_NUM_FRAMES": 250
"PARAMETER_SHARING": True

"FCGRAD": False

"ENTITY": ""
"PROJECT": "fcgrad-unfair-coin"
"WANDB_MODE": "offline"
"WANDB_TAGS":
  - IPPO_COLLECTIVE
  - UNFAIR_COIN
  - SHARED_REWARD
