# Quick test config for FCGrad - minimal timesteps
"LR": 0.0001
"ANNEAL_LR": True

# Minimal PPO hyperparameters for quick test
"NUM_ENVS": 4              # Very small for speed
"NUM_STEPS": 100           # Short rollouts
"TOTAL_TIMESTEPS": 1e5     # Only 100k steps for quick test
"UPDATE_EPOCHS": 2
"NUM_MINIBATCHES": 2       # Minimal minibatches
"GAMMA": 0.99
"GAE_LAMBDA": 0.95
"CLIP_EPS": 0.2
"ENT_COEF": 0.1
"VF_COEF": 0.1
"MAX_GRAD_NORM": 0.5
"ACTIVATION": "relu"

# Environment
"ENV_NAME": "coin_game"
"ENV_KWARGS": 
  "num_agents": 2
  "num_inner_steps": 1000
  "shared_rewards": False
  "green_coin_prob": 0.9375   # Unfair: 15/16 green
  "cnn": True
  "jit": True

"REW_SHAPING_HORIZON": 2.5e6
"SHAPING_BEGIN": 1e6

# Training
"SEED": 99                   # Test seed
"NUM_SEEDS": 1
"REWARD": "individual"
"GIF_NUM_FRAMES": 50        # Short GIF for test
"PARAMETER_SHARING": False   # Test without parameter sharing first

# FCGrad settings - ENABLED
"FCGRAD": True
"USE_DUAL_HEAD": True
"FCGRAD_BETA": 0.5

# WandB
"ENTITY": ""
"PROJECT": "fcgrad-test"
"WANDB_MODE": "offline"
"WANDB_TAGS":
  - TEST
  - FCGRAD
