# =============================================================================
# Cleanup Test Run: 6 Agents with FCGrad
# =============================================================================
# Quick test to verify environment dynamics and logging.
# Shorter total timesteps for fast iteration.
# =============================================================================

"SAVE_PARAMS_AS": "cleanup_6agents_test"

# Learning rate
"LR": 0.0005
"ANNEAL_LR": True

# PPO hyperparameters
"NUM_ENVS": 64
"NUM_STEPS": 1000
"TOTAL_TIMESTEPS": 5e7
"UPDATE_EPOCHS": 2
"NUM_MINIBATCHES": 500
"GAMMA": 0.99
"GAE_LAMBDA": 0.95
"CLIP_EPS": 0.2
"ENT_COEF": 0.01
"VF_COEF": 0.5
"MAX_GRAD_NORM": 0.5
"ACTIVATION": "relu"

# Environment
"ENV_NAME": "cleanup"
"ENV_KWARGS":
  "num_agents": 6
  "num_inner_steps": 1000
  "shared_rewards": False
  "cnn": True
  "jit": True
  "grid_size": [19, 28]
  "map_ASCII":
    - "HFFFHFFHFHFHFHFHFHFHHFHFFFHF"
    - "HFHFHFFHFHFHFHFHFHFHHFHFFFHF"
    - "HFFHFFHHFHFHFHFHFHFHHFHFFFHF"
    - "HFHFHFFHFHFHFHFHFHFHHFHFFFHF"
    - "HFFFFFFHFHFHFHFHFHFHHFHFFFHF"
    - "==============+~FHHHHHHf===="
    - "   P    P      ===+~SSf     "
    - "     P     P   P  <~Sf  P   "
    - "             P   P<~S>      "
    - "   P    P         <~S>   P  "
    - "               P  <~S>P     "
    - "     P           P<~S>      "
    - "           P      <~S> P    "
    - "  P             P <~S>      "
    - "^T^T^T^T^T^T^T^T^T;~S,^T^T^T"
    - "BBBBBBBBBBBBBBBBBBBssBBBBBBB"
    - "BBBBBBBBBBBBBBBBBBBBBBBBBBBB"
    - "BBBBBBBBBBBBBBBBBBBBBBBBBBBB"
    - "BBBBBBBBBBBBBBBBBBBBBBBBBBBB"

# Reward shaping (unused but kept for compatibility)
"REW_SHAPING_HORIZON": 2.5e6
"SHAPING_BEGIN": 1e6

# Training
"SEED": 42
"NUM_SEEDS": 1
"REWARD": "individual"
"GIF_NUM_FRAMES": 250
"PARAMETER_SHARING": False
"TUNE": False

# FCGrad settings
"FCGRAD": True
"USE_DUAL_HEAD": True
"FCGRAD_BETA": 0.7

# WandB
"ENTITY": "simonbruno-university-of-amsterdam"
"PROJECT": "fcgrad"
"WANDB_MODE": "online"
"WANDB_TAGS":
  - FCGRAD
  - CLEANUP
  - 6_AGENTS
  - TEST_RUN
