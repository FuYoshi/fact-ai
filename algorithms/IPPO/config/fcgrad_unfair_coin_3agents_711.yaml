# =============================================================================
# FCGrad on Unfair Coin Game - 3 Agents with 7:1:1 spawn probabilities
# =============================================================================
# FCGrad: Fair Conflict-aware Gradient Adjustment
# Paper: "Fair Cooperation in Mixed-Motive Games via Conflict-Aware Gradient Adjustment"
# by Woojun Kim and Katia Sycara (Carnegie Mellon University)
#
# Architecture:
# - Two value heads: V_ind (individual) and V_col (collective)
# - V_ind trained on individual rewards
# - V_col trained on collective rewards (mean of all agents)
# - FCGrad adjusts gradients when individual and collective objectives conflict
#
# 3 Agents with unfair coin distribution:
# - Agent 0 (red): 7/9 probability (77.78%)
# - Agent 1: 1/9 probability (11.11%)
# - Agent 2: 1/9 probability (11.11%)
# =============================================================================

# descriptive filename to save params as.
"SAVE_PARAMS_AS": "full_unfair_fcgrad_3agents_711"

# Learning rate (paper: 1e-4 with linear annealing)
"LR": 0.0001
"ANNEAL_LR": True

# PPO hyperparameters (from paper Appendix B)
"NUM_ENVS": 256
"NUM_STEPS": 1000
"TOTAL_TIMESTEPS": 1e9
"UPDATE_EPOCHS": 2
"NUM_MINIBATCHES": 500
"GAMMA": 0.99
"GAE_LAMBDA": 0.95
"CLIP_EPS": 0.2
"ENT_COEF": 0.1      # Paper: 0.1
"VF_COEF": 0.1       # Paper: 0.1
"MAX_GRAD_NORM": 0.5
"ACTIVATION": "relu"

# Environment
"ENV_NAME": "coin_game"
"ENV_KWARGS":
  "num_agents": 3
  "num_inner_steps": 1000
  "shared_rewards": False     # CRITICAL: Individual rewards only
  "coin_probs": [0.7778, 0.1111, 0.1111]   # UNFAIR: 7:1:1 ratio (7/9 for agent 0, 1/9 each for agents 1 and 2)
  "cnn": True
  "jit": True

# Reward shaping (not used, but keep for compatibility)
"REW_SHAPING_HORIZON": 2.5e6
"SHAPING_BEGIN": 1e6

# Training
"SEED": 42
"NUM_SEEDS": 1
"REWARD": "individual"
"GIF_NUM_FRAMES": 250
"PARAMETER_SHARING": False
"TUNE": False            # Set to True for hyperparameter sweep

# FCGrad settings - ENABLED
"FCGRAD": True               # Enable FCGrad gradient adjustment
"USE_DUAL_HEAD": True        # Use two value heads (V_ind + V_col)
"FCGRAD_BETA": 0.5           # Paper: β=0.5 for Unfair Coin

# WandB
"ENTITY": ""
"PROJECT": "fcgrad-unfair-coin"
"WANDB_MODE": "online"
"WANDB_TAGS":
  - FCGRAD
  - UNFAIR_COIN
